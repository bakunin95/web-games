<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gauntlet Playground</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Gauntlet Playground</h1>
            <p>Atmospheric Canvas FX · live params · portable modules</p>
          </div>
        </div>
        <div class="chrome-actions">
          <div class="chrome-btns">
            <button type="button" id="create-vfx-btn" class="create-btn">+ Create VFX</button>
            <button type="button" id="reset-vfx-btn" class="reset-btn">Reset</button>
            <button type="button" id="minimize-panel-btn" class="ghost-btn">Minimize editor</button>
          </div>
          <div class="hint">Select · drag move · corner drag / Shift+scroll scale · empty drag pans</div>
        </div>
      </header>

      <div id="stage">
        <canvas id="world-canvas" aria-label="World-space VFX canvas"></canvas>
        <canvas id="overlay-canvas" aria-label="Screen-space overlay canvas"></canvas>
        <div id="css-overlay" aria-hidden="true"></div>
      </div>

      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
